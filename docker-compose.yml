services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hypothesis-court-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypothesis_court}
      POSTGRES_USER: ${POSTGRES_USER:-hypothesis_court}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hypothesis_court}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-init:
    build:
      context: ./backend
    container_name: hypothesis-court-db-init
    command: ["python", "-m", "app.seed.db_init"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypothesis_court}
      POSTGRES_USER: ${POSTGRES_USER:-hypothesis_court}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hypothesis_court}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-jwt-secret-change-me}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-1d}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-1w}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-change-me}
      SUPERADMIN_FIRST_NAME: ${SUPERADMIN_FIRST_NAME:-}
      SUPERADMIN_LAST_NAME: ${SUPERADMIN_LAST_NAME:-}
      CHAT_MAX_PINNED_SESSIONS: ${CHAT_MAX_PINNED_SESSIONS:-5}
      SESSION_MAX_FILES: ${SESSION_MAX_FILES:-100}
      SESSION_FILE_UPLOAD_MAX_BYTES: ${SESSION_FILE_UPLOAD_MAX_BYTES:-104857600}
      USER_MAX_AGENTS: ${USER_MAX_AGENTS:-50}
      MODEL_PROVIDER_BASE_URL: ${MODEL_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      MODEL_PROVIDER_MODEL: ${MODEL_PROVIDER_MODEL:-gpt-4o-mini}
      MODEL_PROVIDER_FOLDER_ID: ${MODEL_PROVIDER_FOLDER_ID:-}
      MODEL_PROVIDER_API_MODE: ${MODEL_PROVIDER_API_MODE:-chat_completions}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_FOLDER_ID: ${EMBEDDING_FOLDER_ID:-}

  backend:
    build:
      context: ./backend
    container_name: hypothesis-court-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypothesis_court}
      POSTGRES_USER: ${POSTGRES_USER:-hypothesis_court}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hypothesis_court}
      BACKEND_CORS_ALLOW_ORIGINS: ${BACKEND_CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-jwt-secret-change-me}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-1d}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-1w}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-change-me}
      SUPERADMIN_FIRST_NAME: ${SUPERADMIN_FIRST_NAME:-}
      SUPERADMIN_LAST_NAME: ${SUPERADMIN_LAST_NAME:-}
      CHAT_MAX_PINNED_SESSIONS: ${CHAT_MAX_PINNED_SESSIONS:-5}
      SESSION_MAX_FILES: ${SESSION_MAX_FILES:-100}
      SESSION_FILE_UPLOAD_MAX_BYTES: ${SESSION_FILE_UPLOAD_MAX_BYTES:-104857600}
      USER_MAX_AGENTS: ${USER_MAX_AGENTS:-50}
      MODEL_PROVIDER_BASE_URL: ${MODEL_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      MODEL_PROVIDER_MODEL: ${MODEL_PROVIDER_MODEL:-gpt-4o-mini}
      MODEL_PROVIDER_FOLDER_ID: ${MODEL_PROVIDER_FOLDER_ID:-}
      MODEL_PROVIDER_API_MODE: ${MODEL_PROVIDER_API_MODE:-chat_completions}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_FOLDER_ID: ${EMBEDDING_FOLDER_ID:-}
    volumes:
      - backend_uploads:/app/storage/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: hypothesis-court-frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_ORGANIZER_SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      VITE_ORGANIZER_SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-change-me}
      FRONTEND_ALLOWED_HOSTS: ${FRONTEND_ALLOWED_HOSTS:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5173', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    build:
      context: ./nginx
    container_name: hypothesis-court-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  backend_uploads:
